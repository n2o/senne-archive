name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default; the image job opts into package publishing.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI-only values so settings.py can load without real secrets.
      SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFG
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Frontend assets must exist before collectstatic.
      - run: npm ci
      - run: npm run build

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - name: Django checks
        run: |
          uv run python manage.py check --deploy --fail-level WARNING
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py collectstatic --noinput
      - run: uv run python manage.py test

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
